<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Défi Rose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column on an orchid watercolor ground (from the campaign poster); ribbon of 10 segments as progress. Single light theme by choice, to match the poster. */
:root{
  color-scheme:light;
  --bg:#FCEAF6; --wash1:#F2B0E2; --wash2:#F8C9EC; --wash3:#EFA3D8;
  --surface:#FFFFFF; --ink:#3A0F2E; --muted:#7A4D6C; --line:#F1C6E3;
  --magenta:#B8106F; --pink:#EE3F8A; --orchid:#D457B4; --soft:#FCE1F1; --on:#FFFFFF;
  --ok:#14724F; --ok-soft:#DFF3EA; --bad:#BF2430; --bad-soft:#FDE4E6;
  --display:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{min-height:100%;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  background:
    radial-gradient(55% 35% at 8% 4%, var(--wash1) 0, transparent 70%),
    radial-gradient(45% 30% at 95% 22%, var(--wash2) 0, transparent 70%),
    radial-gradient(60% 40% at 30% 78%, var(--wash2) 0, transparent 70%),
    radial-gradient(50% 35% at 100% 100%, var(--wash3) 0, transparent 70%),
    var(--bg)}
.wrap{max-width:660px;margin:0 auto;padding-inline:16px;padding-block:18px 40px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--magenta)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--magenta);outline-offset:3px;border-radius:10px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:1.15rem;color:var(--magenta)}
.brand img{width:auto;height:34px;flex:none;filter:drop-shadow(0 2px 4px rgb(184 16 111 / .25))}
.year{font-family:var(--display);font-weight:700;font-size:.85rem;color:var(--on);background:var(--magenta);padding:1px 10px;border-radius:99px;font-variant-numeric:tabular-nums}
.count{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}

.nav{display:flex;justify-content:space-between;gap:10px}
.navbtn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--magenta);font-weight:600;font-size:.92rem}
.navbtn:hover{border-color:var(--magenta)}
.navbtn svg{width:18px;height:18px;flex:none}
[dir="rtl"] .navbtn .flip{transform:scaleX(-1)}

.ribbon{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.ribbon span{height:8px;border-radius:99px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);transition:background .3s}
.ribbon span.ok{background:var(--pink);box-shadow:none}
.ribbon span.no{background:var(--muted);opacity:.45;box-shadow:none}
.ribbon span.cur{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--magenta)}

/* Intro */
.intro{display:flex;flex-direction:column;gap:20px}
/* French visual on the left, heart in the middle, Arabic visual on the right, in every language */
.hero{margin:0;display:grid;grid-template-columns:1fr 1.08fr 1fr;align-items:center;gap:clamp(4px,2vw,14px);direction:ltr;padding-block:6px}
.hero img{width:100%;max-width:100%;height:auto;min-width:0;filter:drop-shadow(0 12px 22px rgb(184 16 111 / .22));transition:transform .3s}
.hero .fr{transform:rotate(-5deg) translateY(8px)}
.hero .ar{transform:rotate(5deg) translateY(8px)}
.hero .heart{position:relative;z-index:1;animation:beat 2.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.06)}24%{transform:scale(.98)}36%{transform:scale(1.04)}}
.eyebrow{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--magenta);font-weight:600}
/* Bilingual pairs: French in the left column, Arabic in the right, same size and weight */
.pair{display:grid;grid-template-columns:1fr 1px 1fr;gap:clamp(10px,3vw,22px);direction:ltr;align-items:start}
.pair::before{content:"";grid-column:2;grid-row:1;align-self:stretch;background:var(--line)}
.pair > .fr{grid-column:1;grid-row:1;text-align:left;min-width:0}
.pair > .ar{grid-column:3;grid-row:1;text-align:right;direction:rtl;min-width:0}
.pair .ar{font-size:1.08em}
.titles h1,.titles .ttl,.titles .ttl.ar{font-family:var(--display);font-size:clamp(1.3rem,5.6vw,2.4rem);font-weight:800;line-height:1.25;color:var(--ink);margin:0;white-space:nowrap}
.titles{align-items:center}
.lede{color:var(--muted)}
.lede p{min-width:0}
.stat{display:flex;flex-direction:column;gap:12px;padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-radius:20px}
.stat b{align-self:center;font-family:var(--display);font-weight:800;font-size:3.2rem;line-height:1;color:var(--magenta);font-variant-numeric:tabular-nums;direction:ltr}
.stat .pair p{color:var(--ink);font-size:.95rem}
.stat .pair .ar{font-size:1.03rem}
.starts{display:grid;grid-template-columns:1fr 1fr;gap:12px;direction:ltr}
@media (max-width:460px){.starts .btn{font-size:.98rem;padding-inline:12px}}
.starts .ar{font-size:1.15rem}
@media (max-width:460px){.starts .ar{font-size:1.04rem}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 22px;border-radius:999px;border:0;background:linear-gradient(135deg,var(--orchid),var(--magenta));color:var(--on);font-family:var(--display);font-weight:700;font-size:1.1rem;text-decoration:none;box-shadow:0 6px 16px rgb(184 16 111 / .25);transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface);color:var(--magenta);box-shadow:inset 0 0 0 2px var(--magenta)}

/* Question */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 20px;display:flex;flex-direction:column;gap:18px;box-shadow:0 10px 30px rgb(184 16 111 / .08)}
.tag{align-self:flex-start;font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--magenta);background:var(--soft);padding:4px 12px;border-radius:99px}
[dir="rtl"] .tag{letter-spacing:0}
.q{font-size:clamp(1.35rem,4.6vw,1.65rem);font-weight:700}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;text-align:start;width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);line-height:1.45;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--pink);background:var(--soft)}
.opt .l{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--magenta);font-family:var(--display);font-weight:700}
.opt .mk{font-weight:700;font-size:1.1rem}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .l{background:var(--ok);color:var(--on)}
.opt.right .mk{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .l{background:var(--bad);color:var(--on)}
.opt.wrong .mk{color:var(--bad)}
.opt.dim{opacity:.55}
.explain{display:flex;flex-direction:column;gap:8px;padding:16px 18px;border-radius:16px;background:var(--soft)}
.verdict{font-family:var(--display);font-weight:700;font-size:1.2rem}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}
.next{align-self:flex-end}

/* Result */
.result{display:flex;flex-direction:column;gap:18px}
.score{flex-direction:row;align-items:center;gap:20px;flex-wrap:wrap}
.ring{width:118px;height:118px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
[dir="rtl"] .ring svg{transform:rotate(-90deg) scaleY(-1)}
.ring .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;direction:ltr;unicode-bidi:isolate}
.ring .v{display:inline-flex;align-items:baseline;gap:2px;font-family:var(--display);font-variant-numeric:tabular-nums;line-height:1}
.ring .v b{font-size:2.3rem;font-weight:800;color:var(--magenta)}
.ring .v small{font-size:1.05rem;font-weight:700;color:var(--muted)}
.score .msg{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:4px}
.score .msg span{font-size:.85rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
[dir="rtl"] .score .msg span{letter-spacing:0}
.score h2{font-size:1.5rem}
.keep h3{font-size:1.2rem}
.keep ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.keep li{display:grid;grid-template-columns:22px 1fr;gap:10px}
.keep li::before{content:"";width:10px;height:10px;margin-top:.55em;margin-inline-start:6px;border-radius:50%;background:var(--pink)}
.song{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center;padding:20px;border-radius:22px;color:var(--on);background:linear-gradient(135deg,var(--orchid),var(--magenta))}
.song img{width:96px;aspect-ratio:1;max-width:100%;filter:drop-shadow(0 6px 12px rgb(58 15 46 / .25))}
.song div{display:flex;flex-direction:column;gap:10px;min-width:0}
.song h3{font-size:1.3rem}
.song p{opacity:.95}
.song .btn{background:var(--on);color:var(--magenta);align-self:flex-start;box-shadow:none;font-size:1rem;min-height:46px}
@media (max-width:460px){.song{grid-template-columns:1fr;justify-items:center;text-align:center}.song .btn{align-self:center}}
.share{color:var(--muted);text-align:center}
.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* Credits */
.credits{border-top:1px solid var(--line);padding-top:18px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:.92rem;color:var(--muted)}
.credits strong{color:var(--ink);font-family:var(--display);font-size:1.05rem}
.mail{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.mail code{font-family:var(--body);user-select:all;color:var(--ink);background:var(--surface);border:1px solid var(--line);padding:4px 10px;border-radius:8px;direction:ltr;unicode-bidi:isolate;word-break:break-all}
.copy{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 12px;font-size:.85rem;color:var(--magenta)}
.disc{font-size:.8rem;max-width:52ch}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.fade{animation:in .35s ease both}
@keyframes in{from{transform:translateY(6px)}to{transform:none}}
</style>
</head>
<body>

<div class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <img id="ribbonImg" alt="Ruban rose">
      <span id="brandName">Le Défi Rose</span>
      <span class="year">2026</span>
    </div>
    <div class="count" id="count"></div>
  </header>
  <nav class="nav" id="nav" hidden></nav>
  <div class="ribbon" id="ribbon" hidden></div>
  <main id="screen"></main>
  <footer class="credits" id="credits"></footer>
</div>

 {tag:{fr:"Qui est concernée ?",ar:"من المعنيّة؟"},

 {tag:{fr:"La guérison",ar:"الشفاء"},

 {tag:{fr:"Idée reçue",ar:"فكرة خاطئة"},
  q:{fr:"La mammographie est-elle dangereuse ou très douloureuse ?",ar:"هل الماموغرافيا خطيرة أو مؤلمة جداً؟"},

     {fr:"Oui, elle nécessite une anesthésie générale",ar:"نعم، تتطلّب تخديراً عاماً"}],

 {tag:{fr:"Signes d'alerte",ar:"علامات الإنذار"},
  q:{fr:"Je découvre une boule dans mon sein. Que faire ?",ar:"اكتشفتُ كتلة في ثديي. ماذا أفعل؟"},
  o:[{fr:"Attendre la prochaine campagne d'octobre",ar:"أنتظر حملة أكتوبر القادمة"},

];

let lang = "fr", idx = 0, answers = [], order = [];
const $ = s => document.querySelector(s);
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const toTop = () => window.scrollTo({ top: 0, behavior: reduced ? "auto" : "smooth" });
const isOk = i => answers[i] != null && !!order[i][answers[i]].ok;
const score = () => Q.reduce((s, _, i) => s + (isOk(i) ? 1 : 0), 0);
const ICON = {
  back:'<svg class="flip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></svg>'
};

function setLang(l){
  lang = l;
  document.documentElement.lang = l;
  document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
  $("#brandName").textContent = UI[l].brand;
}

function nav(onBack){
  const u = UI[lang], n = $("#nav"); n.hidden = false; n.replaceChildren();
  const b = el("button", "navbtn"); b.type = "button"; b.innerHTML = ICON.back; b.append(u.back); b.onclick = onBack;
  const h = el("button", "navbtn"); h.type = "button"; h.innerHTML = ICON.home; h.append(u.home); h.onclick = intro;
  n.append(b, h);
}

function credits(both){
  const u = UI[lang], c = $("#credits"); c.replaceChildren();
  const by = el("div"); by.append(el("span", null, u.by + " "), el("strong", null, "Dr Hi"), el("span", null, " · " + YEAR));
  if (both){ const a = arEl("div"); a.append(el("span", null, UI.ar.by + " "), el("strong", null, "Dr Hi"), el("span", null, " · " + YEAR)); c.append(a); }
  const m = el("div", "mail"); m.append(el("span", null, u.contact));
  const code = el("code", null, EMAIL);
  const btn = el("button", "copy", u.copy); btn.type = "button";
  btn.onclick = () => {
    const done = () => { btn.textContent = u.copied; setTimeout(() => btn.textContent = u.copy, 1600); };
    const sel = () => { const r = document.createRange(); r.selectNodeContents(code); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
    try { navigator.clipboard.writeText(EMAIL).then(done, sel); } catch(e){ sel(); }
  };
  m.append(code, btn);
  c.prepend(by); c.append(m, el("p", "disc", u.disc));
  if (both){ const d = arEl("p", "disc", UI.ar.disc); c.append(d); }
}

function arEl(tag, cls, txt){ const n = el(tag, cls, txt); n.dir = "rtl"; n.lang = "ar"; return n; }

function intro(){
  setLang("fr");
  $("#brandName").textContent = "Le Défi Rose · التحدّي الوردي";
  $("#count").textContent = ""; $("#ribbon").hidden = true; $("#nav").hidden = true;
  const s = $("#screen"); s.replaceChildren();
  const box = el("section", "intro fade");

  const fig = el("figure", "hero");
  [["fr","Un rendez-vous avec ta santé"],["heart","Prendre soin de toi c'est vital"],["ar","موعدكِ مع صحتكِ لا تؤجّليه"]].forEach(([k, alt]) => {
    const im = el("img", k); im.src = IMG[k]; im.alt = alt; fig.append(im);
  });

  const pair = (cls, tag, fr, ar, frCls) => {
    const d = el("div", "pair " + cls);
    const f = el(tag, "fr" + (frCls ? " " + frCls : ""), fr); f.lang = "fr";
    d.append(f, arEl(tag, "ar" + (frCls ? " " + frCls : ""), ar));
    return d;
  };
  const t = pair("titles", "h1", "Le Défi Rose", "التحدّي الوردي", "ttl");
  t.children[1].setAttribute("role", "doc-subtitle");
  const lede = pair("lede", "p",
    "10 questions pour comprendre le dépistage du cancer du sein, avec une explication simple pour chaque réponse.",
    "10 أسئلة لفهم الكشف المبكر عن سرطان الثدي، مع شرح بسيط لكل إجابة.");
  const stat = el("div", "stat");
  stat.append(el("b", null, "99 %"), pair("", "p",
    "des femmes sont en vie 5 ans après un cancer du sein découvert tôt, limité au sein.",
    "من النساء على قيد الحياة بعد 5 سنوات عندما يُكتشف سرطان الثدي مبكراً ومحصوراً في الثدي."));
  const starts = el("div", "starts");
  const bf = el("button", "btn", "Jouer en français"); bf.type = "button"; bf.onclick = () => start("fr");
  const ba = arEl("button", "btn ar", "ابدئي التحدي بالعربية"); ba.type = "button"; ba.onclick = () => start("ar");
  starts.append(bf, ba);
  box.append(fig, t, lede, stat, starts);
  s.append(box);
  credits(true);
  toTop();
}

function start(l){
  setLang(l); idx = 0; answers = [];
  order = Q.map(q => shuffle(q.o));
  credits(); question();
}

function ribbon(){
  const r = $("#ribbon"); r.hidden = false; r.replaceChildren();
  Q.forEach((_, i) => {
    const s = el("span");
    if (answers[i] != null) s.classList.add(isOk(i) ? "ok" : "no");
    if (i === idx) s.classList.add("cur");
    r.append(s);
  });
}

function question(){
  const u = UI[lang], q = Q[idx];
  $("#count").textContent = u.count(idx + 1, Q.length);
  nav(() => { if (idx === 0) intro(); else { idx--; question(); } });
  ribbon();
  const s = $("#screen"); s.replaceChildren();
  const card = el("section", "card fade");
  card.append(el("span", "tag", q.tag[lang]), el("h2", "q", q.q[lang]));
  const opts = el("div", "opts");
  const buttons = order[idx].map((o, i) => {
    const b = el("button", "opt"); b.type = "button";
    b.append(el("span", "l", u.letters[i]), el("span", null, o[lang]), el("span", "mk"));
    b.onclick = () => { answers[idx] = i; reveal(buttons, card, true); };
    opts.append(b); return b;
  });
  card.append(opts);
  s.append(card);
  toTop();
  if (answers[idx] != null) reveal(buttons, card, false);
  else buttons[0].focus({ preventScroll: true });
}

function reveal(buttons, card, fresh){
  const u = UI[lang], q = Q[idx], chosen = answers[idx], ok = isOk(idx);
  buttons.forEach((x, i) => {
    x.disabled = true;
    if (order[idx][i].ok){ x.classList.add("right"); x.querySelector(".mk").textContent = "✓"; }
    else if (i === chosen){ x.classList.add("wrong"); x.querySelector(".mk").textContent = "✗"; }
    else x.classList.add("dim");
  });
  ribbon();
  const ex = el("div", "explain" + (fresh ? " fade" : ""));
  ex.setAttribute("role", "status");
  ex.append(el("p", "verdict " + (ok ? "ok" : "no"), ok ? u.good : u.bad), el("p", null, q.e[lang]));
  const last = idx === Q.length - 1;
  const nx = el("button", "btn next", last ? u.finish : u.next); nx.type = "button";
  nx.onclick = () => { if (last) result(); else { idx++; question(); } };
  card.append(ex, nx);
  nx.focus({ preventScroll: true });
  if (fresh) ex.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "nearest" });
}

function result(){
  const u = UI[lang], n = Q.length, sc = score();
  $("#count").textContent = ""; idx = n; ribbon();
  nav(() => { idx = n - 1; question(); });
  const s = $("#screen"); s.replaceChildren();
  const box = el("section", "result fade");

  const scoreCard = el("div", "card score");
  const ring = el("div", "ring");
  const C = 2 * Math.PI * 50;
  ring.innerHTML = `<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="50" fill="none" stroke="var(--soft)" stroke-width="12"/><circle cx="60" cy="60" r="50" fill="none" stroke="var(--pink)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C * sc / n} ${C}"/></svg>`;
  const num = el("div", "n"), v = el("span", "v"); v.append(el("b", null, String(sc)), el("small", null, "/" + n)); num.append(v); ring.append(num);
  const msg = el("div", "msg");
  const tier = sc >= 9 ? 2 : sc >= 6 ? 1 : 0;
  msg.append(el("span", null, u.scoreLbl), el("h2", null, u.tiers[tier]));
  scoreCard.append(ring, msg);

  const keep = el("div", "card keep");
  const ul = el("ul"); u.keep.forEach(k => ul.append(el("li", null, k)));
  keep.append(el("h3", null, u.keepT), ul);

  const song = el("div", "song");
  const thumb = el("img"); thumb.src = IMG[lang]; thumb.alt = "";
  const txt = el("div");
  const a = el("a", "btn", "▶  " + u.songB); a.href = SONG[lang]; a.target = "_blank"; a.rel = "noopener";
  txt.append(el("h3", null, u.songT), el("p", null, u.songP), a);
  song.append(thumb, txt);

  const actions = el("div", "actions");
  const r = el("button", "btn", u.replay); r.type = "button"; r.onclick = () => start(lang);
  const l = el("button", "btn ghost", u.lang); l.type = "button"; l.onclick = intro;
  actions.append(r, l);

  box.append(scoreCard, keep, song, el("p", "share", u.share), actions);
  s.append(box);
  toTop();
}

intro();
</script>
</body>
</html>
